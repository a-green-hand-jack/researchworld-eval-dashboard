[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gatebench"
version = "0.1.0"
description = "CPU experiments for regression GATE under network interference"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "networkx", "scikit-learn", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]
